# Shared by ALL Max Planck (E17) runs; only name/op/width/seed differ. Same settings as the Carinthia-S runs, SEM input only, 512x512 crops.
train:
  iters: 3000
  batch: 8
  lr: 0.001
  weight_decay: 0.0001
  warmup: 150
  grad_clip: 1.0
  dice_weight: 1.0       # loss = BCE + dice_weight * soft Dice
  log_every: 100
  val_every: 500         # selection metric: mean val Dice over the non-overlapping 512 tiles of the val images
